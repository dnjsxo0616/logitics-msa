name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. 변경된 서비스 감지
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.service-filter.outputs.changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: service-filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            eureka-service:
              - 'eureka-service/**'
            gateway-service:
              - 'gateway-service/**'
            user-service:
              - 'user-service/**'
            hub-service:
              - 'hub-service/**'
            company-service:
              - 'company-service/**'
            product-service:
              - 'product-service/**'
            order-service:
              - 'order-service/**'
            delivery-service:
              - 'delivery-service/**'
            notification-service:
              - 'notification-service/**'

      - name: Check changed services
        run: |
          echo "Changed services: ${{ steps.service-filter.outputs.changes }}"
  

  # ============================================================
  # 2. Build → ECR → ECS
  # ============================================================
  build-and-push:
    needs: detect-changes

    if: ${{ needs.detect-changes.outputs.services != '[]' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    env:
      AWS_REGION: ap-northeast-2
      ECR_REGISTRY: 783490811725.dkr.ecr.ap-northeast-2.amazonaws.com
      ECS_CLUSTER: logitics-cluster

      # latest가 아니라 Git commit SHA를 이미지 태그로 사용
      IMAGE_TAG: ${{ github.sha }}

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================================
      # Java 17
      # ==========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle


      # ==========================================================
      # Gradle
      # ==========================================================
      - name: Grant Gradle permission
        working-directory: ${{ matrix.service }}
        run: chmod +x gradlew

      - name: Build JAR
        working-directory: ${{ matrix.service }}
        run: ./gradlew clean build -x test


      # ==========================================================
      # AWS Credentials
      # ==========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # ECR Login
      # ==========================================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================================
      # Docker Build & Push
      # ==========================================================
      - name: Build and Push Docker image
        working-directory: ${{ matrix.service }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/${{ matrix.service }}:$IMAGE_TAG
          
          echo "========================================"
          echo "Building Docker image"
          echo "IMAGE_URI=$IMAGE_URI"
          echo "========================================"
          
          docker build \
            -t $IMAGE_URI \
            .
          
          docker push $IMAGE_URI
          
          echo "========================================"
          echo "Docker image pushed"
          echo "$IMAGE_URI"
          echo "========================================"
      

      # ==========================================================
      # 현재 ECS Task Definition 확인
      # ==========================================================
      - name: Get current ECS task definition
        run: |
          SERVICE_NAME=logitics-${{ matrix.service }}
          
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE_NAME" \
            --query 'services[0].taskDefinition' \
            --output text)
          
          echo "Current Task Definition:"
          echo "$TASK_DEFINITION_ARN"
          
          echo "TASK_DEFINITION_ARN=$TASK_DEFINITION_ARN" >> "$GITHUB_ENV"
      

      # ==========================================================
      # 현재 Task Definition JSON 가져오기
      # ==========================================================
      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'taskDefinition' \
            --output json > task-definition.json
          
          echo "Current task definition downloaded."
      

      # ==========================================================
      # 컨테이너 이미지 변경
      # ==========================================================
      - name: Update container image
        run: |
          IMAGE_URI=$ECR_REGISTRY/${{ matrix.service }}:$IMAGE_TAG
          
          CONTAINER_NAME="logitics-${{ matrix.service }}"
          CONTAINER_NAME="${CONTAINER_NAME%-service}"
          
          echo "========================================"
          echo "New image:"
          echo "$IMAGE_URI"
          echo "Container:"
          echo "$CONTAINER_NAME"
          echo "========================================"
          
          jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg CONTAINER "$CONTAINER_NAME" \
            '
            .containerDefinitions |=
            map(
              if .name == $CONTAINER
              then
                .image = $IMAGE
              else
                .
              end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            ' \
            task-definition.json \
            > new-task-definition.json
      

      # ==========================================================
      # 새 Task Definition Revision 등록
      # ==========================================================
      - name: Register new task definition
        run: |
          NEW_TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "========================================"
          echo "New Task Definition:"
          echo "$NEW_TASK_DEFINITION_ARN"
          echo "========================================"
          
          echo "NEW_TASK_DEFINITION_ARN=$NEW_TASK_DEFINITION_ARN" >> "$GITHUB_ENV"
      

      # ==========================================================
      # ECS Service를 새 Task Definition으로 변경
      # ==========================================================
      - name: Deploy new task definition
        run: |
          SERVICE_NAME=logitics-${{ matrix.service }}
          
          echo "========================================"
          echo "Deploying ECS service"
          echo "Service: $SERVICE_NAME"
          echo "Task Definition: $NEW_TASK_DEFINITION_ARN"
          echo "========================================"
          
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$SERVICE_NAME" \
            --task-definition "$NEW_TASK_DEFINITION_ARN"
      

      # ==========================================================
      # ECS 배포 완료 대기
      # ==========================================================
      - name: Wait for ECS deployment
        run: |
          SERVICE_NAME=logitics-${{ matrix.service }}
          
          echo "========================================"
          echo "Waiting for ECS deployment..."
          echo "Service: $SERVICE_NAME"
          echo "========================================"
          
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE_NAME"
          
          echo "========================================"
          echo "ECS deployment completed successfully."
          echo "========================================"
