name: ci.yml

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - develop

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.service-filter.outputs.changes }}

      skip-test: ${{ steps.skip-filter.outputs.skip-test }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changed services
        id: service-filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            eureka-service:
              - 'eureka-service/**'
            gateway-service:
              - 'gateway-service/**'
            user-service:
              - 'user-service/**'
            hub-service:
              - 'hub-service/**'
            company-service:
              - 'company-service/**'
            product-service:
              - 'product-service/**'
            order-service:
              - 'order-service/**'
            delivery-service:
              - 'delivery-service/**'
            notification-service:
              - 'notification-service/**'
            

      - name: Detect skip-test changes
        id: skip-filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            skip-test:
              - '.github/**'
              - 'docker-compose.yml'
              - 'README.md'
              - 'docs/**'
              - '.gitignore'

  build-and-test:
    needs: detect-changes

    if: ${{ needs.detect-changes.outputs.services != '[]' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logistics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      POSTGRES_URL: jdbc:postgresql://localhost:5432/logistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      JWT_SECRET: ci-test-secret-key-for-jwt-authentication-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database schemas
        run: |
          PGPASSWORD=${POSTGRES_PASSWORD} psql \
            -h localhost \
            -U ${POSTGRES_USER} \
            -d logistics \
            -f .github/database/init-schema.sql

      - name: Grant Gradle permission
        working-directory: ${{ matrix.service }}
        run: chmod +x gradlew

      - name: Build
        working-directory: ${{ matrix.service }}
        run: ./gradlew clean build -x test

      - name: Test
        working-directory: ${{ matrix.service }}
        run: ./gradlew test --stacktrace

  ci-result:
    name: CI Result
    needs:
      - detect-changes
      - build-and-test

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Check build and test result
        run: |
          echo "services: ${{ needs.detect-changes.outputs.services }}"
          echo "skip-test: ${{ needs.detect-changes.outputs.skip-test }}"
          echo "detect-changes result: ${{ needs.detect-changes.result }}"
          echo "build-and-test result: ${{ needs.build-and-test.result }}"
          
          # detect-changes job 자체 실패 시 CI 실패 처리
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "Detect changes job failed."
            exit 1
          fi
               
          # 서비스 변경 없이 테스트 제외 대상만 변경된 경우
          # build-and-test job은 skipped 되므로 정상 종료 처리
          if [ "${{ needs.detect-changes.outputs.services }}" = "[]" ] &&
             [ "${{ needs.detect-changes.outputs.skip-test }}" = "true" ]; then
            echo "No service changes detected. Skip build and test."
            echo "CI passed"
            exit 0
          fi
          
          # 서비스 변경이 있는 경우 build-and-test 결과 검증
          # failure, cancelled, skipped 모두 실패 처리
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "Build and test failed: ${{ needs.build-and-test.result }}"
            exit 1
          fi
    
          echo "CI passed"
