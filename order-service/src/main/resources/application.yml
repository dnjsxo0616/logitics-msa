server:
  port: ${ORDER_SERVICE_PORT:19005}

spring:
  application:
    name: order-service

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: order_schema

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:19090/eureka}
