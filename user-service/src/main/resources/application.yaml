spring:
  application:
    name: user-service

  # local 환경 실행 기분
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

    properties:
      hibernate:
        default_schema: user_schema
        format_sql: true
        highlight_sql: true

    open-in-view: false

internal:
  service-key: ${INTERNAL_SERVICE_KEY}