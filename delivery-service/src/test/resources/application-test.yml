spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/logistics
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: delivery_test_schema
        format_sql: true
    show-sql: true

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false