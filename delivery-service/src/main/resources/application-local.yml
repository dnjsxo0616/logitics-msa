spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:logistics}
    username: ${POSTGRES_USER:iftrue}
    password: ${POSTGRES_PASSWORD:iftrue1234}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: delivery_schema

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: delivery_schema
    default-schema: delivery_schema

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${EUREKA_PORT:19090}/eureka