spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:delivery_schema}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: delivery_schema
    default-schema: delivery_schema

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}

server:
  port: ${DELIVERY_SERVICE_PORT}