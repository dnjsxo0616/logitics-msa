server:
  port: ${COMPANY_SERVICE_PORT:19003}

spring:
  application:
    name: company-service
  datasource:
    url: ${COMPANY_DB_URL:${POSTGRES_URL:jdbc:postgresql://localhost:5432/logistics}}
    username: ${COMPANY_DB_USERNAME:${POSTGRES_USER:iftrue}}
    password: ${COMPANY_DB_PASSWORD:${POSTGRES_PASSWORD:iftrue1234}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:3000}
            read-timeout: ${FEIGN_READ_TIMEOUT:5000}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:${EUREKA_URI:http://localhost:19090/eureka}}
  instance:
    prefer-ip-address: true

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info

msa:
  security:
    gateway-secret: ${GATEWAY_INTERNAL_SECRET:local-dev-secret}
  validation:
    hub:
      enabled: ${HUB_VALIDATION_ENABLED:false}
    product-delete-policy:
      enabled: ${PRODUCT_DELETE_POLICY_ENABLED:false}
