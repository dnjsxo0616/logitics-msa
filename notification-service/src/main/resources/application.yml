server:
  port: ${NOTIFICATION_SERVICE_PORT:19008}

spring:
  application:
    name: notification-service

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/logistics}
    username: ${POSTGRES_USER:iftrue}
    password: ${POSTGRES_PASSWORD:iftrue1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_schema

  flyway:
    enabled: true
    schemas: notification_schema
    default-schema: notification_schema
    locations: classpath:db/migration

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-flash-lite-latest}
            temperature: 0
            candidate-count: 1
            response-mime-type: application/json

notification:
  ai:
    timezone: Asia/Seoul
    work-start: "09:00"
    work-end: "18:00"
    max-prompt-chars: 4000
    processing-interval: 5s
    processing-timeout: 2m
  slack:
    bot-token: ${SLACK_BOT_TOKEN}
    base-url: ${SLACK_API_BASE_URL:https://slack.com}
    connect-timeout: 3s
    read-timeout: 10s

internal:
  service-key: ${INTERNAL_SERVICE_KEY}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:19090/eureka}
