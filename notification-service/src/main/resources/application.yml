server:
  port: ${NOTIFICATION_SERVICE_PORT:19008}

spring:
  application:
    name: notification-service

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/logistics}
    username: ${POSTGRES_USER:iftrue}
    password: ${POSTGRES_PASSWORD:iftrue1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_schema

  flyway:
    enabled: true
    schemas: notification_schema
    default-schema: notification_schema
    locations: classpath:db/migration

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:19090/eureka}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.7-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  connect-timeout: ${GEMINI_CONNECT_TIMEOUT:5s}
  read-timeout: ${GEMINI_READ_TIMEOUT:30s}

notification:
  business-zone: ${NOTIFICATION_BUSINESS_ZONE:Asia/Seoul}
  work-start-time: ${NOTIFICATION_WORK_START_TIME:09:00}
  work-end-time: ${NOTIFICATION_WORK_END_TIME:18:00}
