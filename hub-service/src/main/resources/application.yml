spring:
  application:
    name: hub-service

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: hub_schema
    open-in-view: false

  flyway:
    enabled: true
    schemas: hub_schema
    default-schema: hub_schema
    locations: classpath:db/migration

internal:
  service-key: ${INTERNAL_SERVICE_KEY}